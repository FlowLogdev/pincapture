<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PinCapture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      min-height: 520px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #0f172a;
    }
    #header {
      background: #023465;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { color: #fff; font-weight: 800; font-size: 16px; letter-spacing: 0; }
    .pill {
      background: rgba(255,221,0,0.16);
      color: #ffdd00;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
    }
    #titlerow, #controls, #actions, #status {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 12px;
    }
    label {
      display: block;
      color: #64748b;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #023465; }
    button {
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: #fff;
      color: #023465;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 10px;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    #recbtn {
      width: 100%;
      border: 0;
      color: #fff;
      background: #023465;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
    }
    #recbtn.on { background: #dc2626; }
    #pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      display: none;
      animation: pulse 1s infinite;
    }
    #recbtn.on #pulse { display: block; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
    #actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    #save { grid-column: span 3; background: #ffdd00; border-color: #ffdd00; color: #023465; }
    #openapp { grid-column: span 3; }
    #status {
      display: none;
      color: #475569;
      font-size: 12px;
      line-height: 1.45;
    }
    #status.show { display: block; }
    #status.error { color: #dc2626; background: #fef2f2; border-color: #fecaca; }
    #stepsarea {
      padding: 10px;
      max-height: 275px;
      overflow-y: auto;
    }
    #empty {
      padding: 34px 18px;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.7;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 9px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .step img {
      width: 78px;
      height: 48px;
      object-fit: cover;
      border-right: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .info { min-width: 0; flex: 1; padding: 7px 0; }
    .title {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta { color: #64748b; font-size: 10px; margin-top: 2px; }
    .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #ffdd00;
      color: #023465;
      font-size: 10px;
      font-weight: 800;
      margin-right: 5px;
    }
    .del {
      border: 0;
      color: #dc2626;
      padding: 8px;
      background: transparent;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="header">
    <div class="brand">PinCapture</div>
    <div class="pill">Recorder</div>
  </div>

  <div id="titlerow">
    <label for="guidetitle">Guide title</label>
    <input id="guidetitle" type="text" placeholder="How to complete this process" maxlength="80"/>
  </div>

  <div id="controls">
    <button id="recbtn">
      <span id="pulse"></span>
      <span id="rectext">Start recording</span>
    </button>
  </div>

  <div id="status"></div>

  <div id="stepsarea">
    <div id="empty">Press Start recording, then click through the process you want to document.</div>
  </div>

  <div id="actions">
    <button id="save" disabled>Save to dashboard</button>
    <button id="expPdf" disabled>PDF</button>
    <button id="expDocx" disabled>Word</button>
    <button id="expPptx" disabled>PPTX</button>
    <button id="expPpsx" disabled>PPSX</button>
    <button id="expPps" disabled>PPS</button>
    <button id="clear" disabled>Clear</button>
    <button id="openapp">Open dashboard</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
