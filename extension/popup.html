<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PinCapture</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f5f2;
      --surface: #fbfbf9;
      --surface-2: #efefeb;
      --text: #1c1f23;
      --text-strong: #111316;
      --text-muted: #5d6269;
      --text-faint: #7f858c;
      --border: #d9d9d4;
      --border-strong: #c5c7c2;
      --accent: #355f87;
      --on-accent: #f8fafc;
      --accent-soft: #e4ebf1;
      --danger: #a34848;
      --danger-soft: #f4e9e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #17191b;
        --surface: #1e2023;
        --surface-2: #26292d;
        --text: #e5e6e3;
        --text-strong: #f5f5f2;
        --text-muted: #afb3b9;
        --text-faint: #858b93;
        --border: #35383d;
        --border-strong: #484c52;
        --accent: #7d9fbd;
        --on-accent: #111316;
        --accent-soft: #273642;
        --danger: #d18080;
        --danger-soft: #3b2929;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      min-height: 520px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page);
      color: var(--text);
    }
    #header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { color: var(--text-strong); font-weight: 800; font-size: 16px; letter-spacing: -0.02em; }
    .pill {
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
    }
    #titlerow, #controls, #actions, #status {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px;
    }
    label {
      display: block;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text-strong);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 10px;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    #recbtn {
      width: 100%;
      border: 0;
      color: var(--on-accent);
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
    }
    #recbtn.on { background: var(--danger); color: var(--surface); }
    #pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--surface);
      display: none;
      animation: pulse 1s infinite;
    }
    #recbtn.on #pulse { display: block; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
    #actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    #save { grid-column: span 3; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    #openapp { grid-column: span 3; }
    #status {
      display: none;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.45;
    }
    #status.show { display: block; }
    #status.error { color: var(--danger); background: var(--danger-soft); border-color: var(--danger); }
    #stepsarea {
      padding: 10px;
      max-height: 275px;
      overflow-y: auto;
    }
    #empty {
      padding: 34px 18px;
      text-align: center;
      color: var(--text-faint);
      font-size: 12px;
      line-height: 1.7;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .step img {
      width: 78px;
      height: 48px;
      object-fit: cover;
      border-right: 1px solid var(--border);
      flex-shrink: 0;
    }
    .info { min-width: 0; flex: 1; padding: 7px 0; }
    .title {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta { color: var(--text-muted); font-size: 10px; margin-top: 2px; }
    .num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 10px;
      font-weight: 800;
      margin-right: 5px;
    }
    .del {
      border: 0;
      color: var(--danger);
      padding: 8px;
      background: transparent;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="header">
    <div class="brand">PinCapture</div>
    <div class="pill">Recorder</div>
  </div>

  <div id="titlerow">
    <label for="guidetitle">Guide title</label>
    <input id="guidetitle" type="text" placeholder="How to complete this process" maxlength="80"/>
  </div>

  <div id="controls">
    <button id="recbtn">
      <span id="pulse"></span>
      <span id="rectext">Start recording</span>
    </button>
  </div>

  <div id="status"></div>

  <div id="stepsarea">
    <div id="empty">Press Start recording, then click through the process you want to document.</div>
  </div>

  <div id="actions">
    <button id="save" disabled>Save to dashboard</button>
    <button id="expPdf" disabled>PDF</button>
    <button id="expDocx" disabled>Word</button>
    <button id="expPptx" disabled>PPTX</button>
    <button id="expPpsx" disabled>PPSX</button>
    <button id="expPps" disabled>PPS</button>
    <button id="clear" disabled>Clear</button>
    <button id="openapp">Open dashboard</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
