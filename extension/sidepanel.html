<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PinCapture</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f5f2;
      --surface: #fbfbf9;
      --surface-2: #efefeb;
      --text: #1c1f23;
      --text-strong: #111316;
      --text-muted: #5d6269;
      --text-faint: #7f858c;
      --border: #d9d9d4;
      --border-strong: #c5c7c2;
      --accent: #355f87;
      --on-accent: #f8fafc;
      --accent-soft: #e4ebf1;
      --danger: #a34848;
      --danger-soft: #f4e9e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #17191b;
        --surface: #1e2023;
        --surface-2: #26292d;
        --text: #e5e6e3;
        --text-strong: #f5f5f2;
        --text-muted: #afb3b9;
        --text-faint: #858b93;
        --border: #35383d;
        --border-strong: #484c52;
        --accent: #7d9fbd;
        --on-accent: #111316;
        --accent-soft: #273642;
        --danger: #d18080;
        --danger-soft: #3b2929;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-width: 360px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page);
      color: var(--text);
      overflow: hidden;
    }
    #shell { height: 100vh; display: flex; flex-direction: column; }
    #header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand { color: var(--text-strong); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
    .pill {
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 800;
    }
    #top {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px;
      flex-shrink: 0;
    }
    label {
      display: block;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      border-radius: 6px;
      padding: 9px 10px;
      font: inherit;
      font-size: 15px;
      outline: none;
      margin-bottom: 10px;
    }
    input:focus { border-color: var(--accent); }
    button {
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text-strong);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      padding: 9px 10px;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    #capturebtn {
      width: 100%;
      border: 0;
      color: var(--on-accent);
      background: var(--accent);
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    #capturebtn.on { background: var(--danger); color: var(--surface); }
    #shotbtn {
      width: 100%;
      margin-top: 8px;
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
      min-height: 46px;
    }
    #videoControls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    #startvideo, #stopvideo {
      min-height: 44px;
    }
    #startvideo {
      background: var(--surface);
      color: var(--text-strong);
    }
    #videoNote {
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.4;
      margin-top: 6px;
      text-align: center;
    }
    #stopvideo {
      background: var(--danger);
      border-color: var(--danger);
      color: var(--surface);
    }
    #pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--surface);
      display: none;
      animation: pulse 1s infinite;
    }
    #capturebtn.on #pulse { display: block; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
    #status {
      display: none;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.45;
      padding: 10px 12px;
      flex-shrink: 0;
    }
    #status.show { display: block; }
    #status.error { color: var(--danger); background: var(--danger-soft); border-color: var(--danger); }
    #captureHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 12px 8px;
      color: var(--text-strong);
      flex-shrink: 0;
    }
    #captureHeader h2 { font-size: 17px; }
    #count { color: var(--text-muted); font-size: 14px; font-weight: 800; }
    #stepsarea {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 8px 12px;
    }
    #empty {
      margin-top: 36px;
      padding: 22px 16px;
      text-align: center;
      color: var(--text-faint);
      font-size: 14px;
      line-height: 1.7;
      border: 1px dashed var(--border-strong);
      border-radius: 6px;
      background: var(--surface);
    }
    .slide {
      background: var(--surface);
      border: 0;
      border-radius: 0;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: none;
    }
    .slideTop {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-bottom: 0;
    }
    .num {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--on-accent);
      font-size: 15px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .titleWrap { min-width: 0; flex: 1; }
    .title {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
    .del {
      border: 0;
      color: var(--danger);
      padding: 7px 9px;
      background: transparent;
      flex-shrink: 0;
    }
    .slide img, .slide video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: var(--surface);
    }
    .slide video { background: #111316; }
    #footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 12px 12px;
      flex-shrink: 0;
    }
    #finish {
      width: 100%;
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
      min-height: 46px;
      margin-bottom: 8px;
    }
    #exportGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    #openapp, #clear { grid-column: span 3; }
  </style>
</head>
<body>
  <div id="shell">
    <div id="header">
      <div class="brand">PinCapture</div>
      <div class="pill">Recorder</div>
    </div>

    <div id="top">
      <label for="guidetitle">Guide title</label>
      <input id="guidetitle" type="text" placeholder="How to complete this process" maxlength="80"/>
      <button id="capturebtn">
        <span id="pulse"></span>
        <span id="capturetext">Start Capture Screenshots</span>
      </button>
      <button id="shotbtn" disabled>Capture screenshot</button>
      <div id="videoControls">
        <button id="startvideo">Start video</button>
        <button id="stopvideo" disabled>Stop video</button>
      </div>
      <div id="videoNote">Optimized for reliable recordings up to 10 minutes.</div>
    </div>

    <div id="status"></div>

    <div id="captureHeader">
      <h2>Screen captures</h2>
      <span id="count">0 slides</span>
    </div>

    <div id="stepsarea">
      <div id="empty">Click Start Capture Screenshots, expand or navigate the webpage normally, then click Capture screenshot in this right panel whenever you want to save the visible screen.</div>
    </div>

    <div id="footer">
      <button id="finish" disabled>Finish and save to dashboard</button>
      <div id="exportGrid">
        <button id="expPdf" disabled>PDF</button>
        <button id="expDocx" disabled>Word</button>
        <button id="expPptx" disabled>PPTX</button>
        <button id="expPpsx" disabled>PPSX</button>
        <button id="expPps" disabled>PPS</button>
        <button id="clear" disabled>Clear</button>
        <button id="openapp">Open dashboard</button>
      </div>
    </div>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
