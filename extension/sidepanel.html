<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PinCapture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-width: 360px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #0f172a;
      overflow: hidden;
    }
    #shell { height: 100vh; display: flex; flex-direction: column; }
    #header {
      background: #023465;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand { color: #fff; font-weight: 800; font-size: 20px; letter-spacing: 0; }
    .pill {
      background: rgba(255,221,0,0.16);
      color: #ffdd00;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 800;
    }
    #top {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 12px;
      flex-shrink: 0;
    }
    label {
      display: block;
      color: #64748b;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 9px 10px;
      font: inherit;
      font-size: 15px;
      outline: none;
      margin-bottom: 10px;
    }
    input:focus { border-color: #023465; }
    button {
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: #fff;
      color: #023465;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      padding: 9px 10px;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    #capturebtn {
      width: 100%;
      border: 0;
      color: #fff;
      background: #023465;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    #capturebtn.on { background: #dc2626; }
    #shotbtn {
      width: 100%;
      margin-top: 8px;
      background: #ffdd00;
      border-color: #ffdd00;
      color: #023465;
      min-height: 46px;
    }
    #videoControls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    #startvideo, #stopvideo {
      min-height: 44px;
    }
    #startvideo {
      background: #fff;
      color: #023465;
    }
    #videoNote {
      color: #64748b;
      font-size: 11px;
      line-height: 1.4;
      margin-top: 6px;
      text-align: center;
    }
    #stopvideo {
      background: #dc2626;
      border-color: #dc2626;
      color: #fff;
    }
    #pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      display: none;
      animation: pulse 1s infinite;
    }
    #capturebtn.on #pulse { display: block; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
    #status {
      display: none;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      color: #475569;
      font-size: 13px;
      line-height: 1.45;
      padding: 10px 12px;
      flex-shrink: 0;
    }
    #status.show { display: block; }
    #status.error { color: #dc2626; background: #fef2f2; border-color: #fecaca; }
    #captureHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 12px 8px;
      color: #023465;
      flex-shrink: 0;
    }
    #captureHeader h2 { font-size: 17px; }
    #count { color: #64748b; font-size: 14px; font-weight: 800; }
    #stepsarea {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 8px 12px;
    }
    #empty {
      margin-top: 36px;
      padding: 22px 16px;
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.7;
      border: 1px dashed #cbd5e1;
      border-radius: 6px;
      background: #fff;
    }
    .slide {
      background: #fff;
      border: 0;
      border-radius: 0;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: none;
    }
    .slideTop {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-bottom: 0;
    }
    .num {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #ffdd00;
      color: #023465;
      font-size: 15px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .titleWrap { min-width: 0; flex: 1; }
    .title {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta { color: #64748b; font-size: 12px; margin-top: 2px; }
    .del {
      border: 0;
      color: #dc2626;
      padding: 7px 9px;
      background: transparent;
      flex-shrink: 0;
    }
    .slide img, .slide video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      background: #fff;
    }
    .slide video { background: #000; }
    #footer {
      background: #fff;
      border-top: 1px solid #e2e8f0;
      padding: 10px 12px 12px;
      flex-shrink: 0;
    }
    #finish {
      width: 100%;
      background: #ffdd00;
      border-color: #ffdd00;
      color: #023465;
      min-height: 46px;
      margin-bottom: 8px;
    }
    #exportGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    #openapp, #clear { grid-column: span 3; }
  </style>
</head>
<body>
  <div id="shell">
    <div id="header">
      <div class="brand">PinCapture</div>
      <div class="pill">Recorder</div>
    </div>

    <div id="top">
      <label for="guidetitle">Guide title</label>
      <input id="guidetitle" type="text" placeholder="How to complete this process" maxlength="80"/>
      <button id="capturebtn">
        <span id="pulse"></span>
        <span id="capturetext">Start Capture Screenshots</span>
      </button>
      <button id="shotbtn" disabled>Capture screenshot</button>
      <div id="videoControls">
        <button id="startvideo">Start video</button>
        <button id="stopvideo" disabled>Stop video</button>
      </div>
      <div id="videoNote">Optimized for reliable recordings up to 10 minutes.</div>
    </div>

    <div id="status"></div>

    <div id="captureHeader">
      <h2>Screen captures</h2>
      <span id="count">0 slides</span>
    </div>

    <div id="stepsarea">
      <div id="empty">Click Start Capture Screenshots, expand or navigate the webpage normally, then click Capture screenshot in this right panel whenever you want to save the visible screen.</div>
    </div>

    <div id="footer">
      <button id="finish" disabled>Finish and save to dashboard</button>
      <div id="exportGrid">
        <button id="expPdf" disabled>PDF</button>
        <button id="expDocx" disabled>Word</button>
        <button id="expPptx" disabled>PPTX</button>
        <button id="expPpsx" disabled>PPSX</button>
        <button id="expPps" disabled>PPS</button>
        <button id="clear" disabled>Clear</button>
        <button id="openapp">Open dashboard</button>
      </div>
    </div>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
